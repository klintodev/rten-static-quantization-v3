schema_version = "1.4"
artifacts = [{ source = "/app", exclude = [".git", "target"] }]

[task]
name = "local/rten-static-quantization-v3"
version = "3.0.0"
description = "Implement static quantization, calibration, and memory-bounded mixed-precision ONNX export in RTen."

[metadata]
difficulty = "hard"
category = "software-engineering"
tags = ["rust", "onnx", "quantization", "graph-optimization"]
upstream_repo = "https://github.com/robertknight/rten"
upstream_commit = "e77a3b6e12650512449f66843b6508ec913ebd17"

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 6144
storage_mb = 16384

[agent]
timeout_sec = 7200.0
network_mode = "no-network"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"
